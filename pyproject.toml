[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tiliqua"
version = "0.2.0"
description = "Modular framework for large-scale document mining, SLR, and bibliographic extraction using OpenAI Responses API + Batch"
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "batch", "openai", "slr", "document-mining", "nlp", "ocr", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "pymupdf>=1.23.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
notebook = [
    "pandas>=2.0.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiliqua*"]
